# This file describes the python package requirements for the Qrisp VRP solver
[project]
name = "toolbox-solvers-qrisp-vrp"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "qrisp==0.9.10",
    "numpy>=2.0,<2.5",
    "tsplib95==0.7.1",
    "sympy==1.13",
]

[tool.uv]
package = false
