# This file describes the python package requirements for the Qrisp QUBO solver
[project]
name = "toolbox-solvers-qrisp-qubo"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "qrisp==0.4.4",
    "numpy==1.26.4",
    "gurobipy==13",
    "sympy==1.12.1",
]

[tool.uv]
package = false
