# This file describes the python package requirements for all GAMS solvers.
# We only build one venv for all of GAMS, not for every GAMS solver.
[project]
name = "toolbox-solvers-gams-python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "networkx",
    "gamspy==1.23.1",
]

[tool.uv]
package = false
