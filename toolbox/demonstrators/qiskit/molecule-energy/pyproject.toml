# This file describes the python package requirements for all Qiskit demonstrator scripts
# supported by ProvideQ
# required for molecule energy solver
[project]
name = "toolbox-demonstrators-qiskit-molecule-energy"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "qiskit==1.1.0",
    "qiskit-aer==0.14.2",
    "qiskit-algorithms==0.3.0",
    "qiskit-ibm-runtime==0.25.0",
    "qiskit-machine-learning==0.7.2",
    "qiskit-nature==0.7.2",
    "qiskit-nature-pyscf==0.4.0",
    "qiskit-qasm3-import==0.5.0",
    "qiskit-transpiler-service==0.4.5",
    "matplotlib==3.9.2",
]

[tool.uv]
package = false

# ibm-platform-services' sdist build needs pkg_resources, which recent
# setuptools versions no longer provide in isolated build environments.
[tool.uv.extra-build-dependencies]
ibm-platform-services = ["setuptools<81"]
ibm-cloud-sdk-core = ["setuptools<81"]
